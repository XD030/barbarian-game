<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蠻族迷宮生存</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Silkscreen&display=swap">
<style>
/* Layout: sticky calendar bar; city = roster | portal panel + district tabs; labyrinth = map/tower + room events | party; battle = portrait column: order bar, monster stage, team faces, commands, floating popups.
   Mobile (<=720px): Tower-of-Saviors-style — district tabs become a fixed bottom icon bar, the dungeon event panel becomes a fixed bottom sheet, battle fills the whole screen. See the "Mobile (phone) layout" media query near the end of this stylesheet. */
:root{
  --bg:#16120e; --panel:#211b15; --panel2:#2a2219; --line:#3b3025; --ink:#ece2cf; --mute:#a3937b; --dim:#6f6352;
  --torch:#e6a03b; --torch-hi:#ffd27f; --blood:#c4493a; --mind:#9b7fd6; --soul:#5aa9d6; --gold:#d8b45a; --void:#0e0b08; --good:#bfe39a;
  --f-title:"LXGW WenKai TC","Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Silkscreen","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
h1,h2,h3{font-family:var(--f-title);font-weight:700;margin:0;text-wrap:balance}
h2{font-size:18px;color:var(--torch-hi)}
h3{font-size:15px}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto}
.mute{color:var(--mute)} .dim{color:var(--dim)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 18px calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.brand{font-family:var(--f-title);font-size:20px;color:var(--torch);white-space:nowrap}
.day{font-family:var(--f-title);color:var(--ink);white-space:nowrap}
.day.open{color:var(--torch-hi)}
.res{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0;align-items:center}
.res .rchip{white-space:nowrap;color:var(--mute);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:2px 10px;font-size:12.5px}
.res .rchip.sec{opacity:.68;border-color:transparent;background:none}
.res .rchip b{font-family:var(--f-num);font-weight:400;color:var(--ink);margin-left:4px}
.res .rchip.low{border-color:var(--blood);color:#f0b4a8}
.res .rchip.low b{color:var(--blood)}
button{touch-action:manipulation}
.btn{font:inherit;background:var(--panel2);color:var(--ink);border:1px solid var(--line);padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--torch)}
.btn:focus-visible,select:focus-visible,input:focus-visible,.room:focus-visible,.foeU:focus-visible,.opt:focus-visible,.swatch:focus-visible,.cmdb:focus-visible,.tab:focus-visible{outline:2px solid var(--torch-hi);outline-offset:2px}
.btn.primary{background:var(--torch);border-color:var(--torch);color:#1c1309;font-weight:700}
.btn.primary:hover:not(:disabled){background:var(--torch-hi)}
.btn.danger{border-color:#6a2c24;color:#f0b4a8}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn:disabled{opacity:.42;cursor:not-allowed}
select{font:inherit;background:var(--void);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.panel>h2:first-child,.panel>.panel-h:first-child{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:2px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.camp{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:920px){.camp{grid-template-columns:1fr}}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{font:inherit;font-size:13px;background:none;border:1px solid transparent;color:var(--mute);padding:4px 9px;border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.tab[aria-selected="true"]{color:var(--torch-hi);border-color:var(--torch);background:var(--panel2)}
.tab:hover{color:var(--ink)}
.tab .ic{font-family:var(--f-title);color:var(--torch);font-size:13px}
.tab[aria-selected="true"] .ic{color:var(--torch-hi)}
/* city map(手機版建物選單,神魔之塔風格的可點地圖) */
.citymap{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;padding:20px 10px 14px;background:radial-gradient(ellipse 120% 90% at 50% -10%,#3a3022,#191410 75%);border-radius:10px;border:1px solid var(--line)}
.citymap .bld{font:inherit;background:none;border:0;color:var(--ink);cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.citymap .bld .ico{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-title);font-size:24px;color:#1c1309;box-shadow:0 4px 0 rgba(0,0,0,.4),inset 0 -5px 0 rgba(0,0,0,.18);border:2px solid rgba(0,0,0,.3);transition:transform .15s}
.citymap .bld:hover .ico,.citymap .bld:active .ico{transform:translateY(-2px)}
.citymap .bld .tl{font-size:12px;color:var(--mute)}
.citymap .bld.home .ico{background:linear-gradient(#c9a876,#9c7f52)}
.citymap .bld.tavern .ico{background:linear-gradient(var(--torch-hi),var(--torch))}
.citymap .bld.guild .ico{background:linear-gradient(#8a9aae,#596b80)}
.citymap .bld.library .ico{background:linear-gradient(#7e9fd6,#4a6aa0)}
.citymap .bld.exchange .ico{background:linear-gradient(var(--gold),#a4802e)}
.citymap .bld.temple .ico{background:linear-gradient(#d6bdf0,var(--mind))}
.citymap .bld.smith .ico{background:linear-gradient(#e08a5a,#a24a2c)}
.citymap .bld.store .ico{background:linear-gradient(var(--good),#5e9a4a)}
.bback{align-self:flex-start}
/* city bottom tab bar(手機版,神魔之塔風格的主選單列,中間是迷宮開啟倒數的圓形按鍵) */
.mtabbar{position:fixed;left:0;right:0;bottom:0;z-index:18;display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:end;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.4)}
.mtab{font:inherit;background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:4px 2px;border-radius:8px;cursor:pointer}
.mtab[aria-pressed="true"]{color:var(--torch-hi)}
.mtab .ic{font-family:var(--f-title);font-size:18px;color:var(--torch)}
.mtab[aria-pressed="true"] .ic{color:var(--torch-hi)}
.mtab:disabled{opacity:.3;cursor:default}
.mtab.center{transform:translateY(-16px)}
.mtab.center .orb{width:58px;height:58px;border-radius:50%;background:linear-gradient(var(--torch-hi),var(--torch));color:#1c1309;display:grid;place-items:center;font-family:var(--f-num);font-size:15px;font-weight:700;border:3px solid var(--panel);box-shadow:0 4px 10px rgba(0,0,0,.5);line-height:1.15;text-align:center}
.mtab.center .orb small{display:block;font-family:var(--f-body);font-size:8.5px;font-weight:400}
/* 隊伍畫面(手機版,仿神魔之塔的隊伍編輯畫面) */
.teamhead{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:2px}
.teamslots{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px}
.tslot{flex:0 0 auto;width:52px;background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:4px 2px 3px;position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tslot img{width:38px;height:43px;image-rendering:pixelated}
.tslot .lv{font-family:var(--f-num);font-size:9px;color:var(--gold)}
.tslot.in{border-color:var(--torch)}
.tslot.foc{box-shadow:0 0 0 2px var(--torch-hi)}
.tslot.dead{opacity:.45;border-style:dashed}
.tslot .chk{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--torch);color:#1c1309;font-size:10px;line-height:16px;text-align:center;font-weight:700}
.tslot.empty{border-style:dashed;opacity:.55}
.tslot.empty .plus{font-size:19px;color:var(--dim);line-height:43px;height:43px}
.subtabs{display:flex;gap:4px;margin:8px 0 2px}
.stab{flex:1;font:inherit;font-size:12.5px;padding:6px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--mute);cursor:pointer}
.stab.sel{color:var(--torch-hi);border-color:var(--torch);background:#352a1d}
.booktabs{display:flex;gap:3px;overflow-x:auto;padding:0 2px}
.booktab{flex:0 0 auto;min-width:28px;padding:5px 9px 4px;border-radius:8px 8px 0 0;background:var(--panel2);border:1px solid var(--line);border-bottom:0;font-size:11.5px;color:var(--mute);cursor:pointer;font-family:var(--f-num)}
.booktab::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--c,var(--dim));margin-right:4px;vertical-align:1px}
.booktab.empty::before{background:none;border:1px dashed var(--dim)}
.booktab.sel{background:var(--panel);color:var(--torch-hi);border-color:var(--torch)}
.bookpanel{background:var(--panel);border:1px solid var(--line);border-radius:0 8px 8px 8px;padding:10px;margin-top:-1px}
.bookpanel b{font-family:var(--f-title);color:var(--torch-hi);font-size:14px}
.essList{display:flex;flex-direction:column;gap:7px;max-height:58vh;overflow-y:auto;padding-right:2px}
.essCard{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:6px;padding:8px 10px}
.essCard b{font-family:var(--f-title);color:var(--torch-hi);font-size:14px}
.essCard.empty{border-left-style:dashed;opacity:.6}
.essCard.empty b{color:var(--mute);font-family:var(--f-body);font-size:13px}
.bagGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.gcard{position:relative;font:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--ink)}
.gcard:hover{border-color:var(--torch)}
.gcard .gicon{width:100%;aspect-ratio:1;border-radius:6px;background:var(--void);display:grid;place-items:center;font-family:var(--f-title);color:#1c1309;font-size:13px}
.gcard .gname{font-size:9px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gcard .gbadge{position:absolute;top:2px;left:2px;background:var(--void);color:var(--gold);font-size:8px;padding:0 3px;border-radius:3px;font-family:var(--f-num);z-index:1}
.meter{height:6px;background:var(--void);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;transition:width .25s}
.hp i{background:var(--blood)} .st i{background:var(--mind)} .xp i{background:var(--gold)} .sl i{background:var(--soul)} .tm i{background:var(--torch)} .tg i{background:#e8e0cc}
.st.hi i{background:#c66ad6}
.mrow{display:grid;grid-template-columns:34px 1fr 64px;gap:8px;align-items:center;font-size:12.5px;color:var(--mute)}
.mrow .num{text-align:right;color:var(--ink);font-size:11px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mcard{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mcard.is-sel{border-color:var(--torch);box-shadow:inset 0 0 0 1px var(--torch)}
.mcard.dead{opacity:.6;border-style:dashed}
.mhead{display:flex;gap:10px;align-items:center}
.spr{image-rendering:pixelated;width:45px;height:51px;flex:none;background:var(--void);border-radius:4px}
.mname{flex:1;min-width:0;display:flex;flex-direction:column}
.mname b{font-family:var(--f-title);font-size:16px}
.mname span{font-size:12.5px;color:var(--mute)}
.lv{font-family:var(--f-num);font-style:normal;color:var(--gold);font-size:11px;margin-left:4px}
.go{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--mute);cursor:pointer;white-space:nowrap}
.go input{accent-color:var(--torch);width:16px;height:16px}
.statline{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute)}
.statline b{font-family:var(--f-num);font-weight:400;color:var(--ink);font-size:11px;margin-left:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--mute);background:var(--void);cursor:help;white-space:nowrap}
.chip.good{color:#b9d9a0;border-color:#3d5230}
.chip.bad{color:#e3a99c;border-color:#5a2f27}
.chip.ess{color:var(--ink)}
.chip.ess::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--c,#888);margin-right:5px;vertical-align:1px}
.chip.rb::before{background:linear-gradient(90deg,#f55,#fb4,#5d5,#5bf,#b6f)}
.chip.empty{border-style:dashed;color:var(--dim);cursor:default}
.chip.hero{color:#1c1309;background:var(--torch);border-color:var(--torch)}
.chip.grade{color:var(--gold);border-color:#5a4a28}
.chip.item{color:#a8d0f0;border-color:#2a4a62}
.mact{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.mact label{font-size:12.5px;color:var(--mute);display:flex;gap:4px;align-items:center}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item small{grid-column:1/-1;color:var(--mute);font-size:12px}
.cost{font-size:12px;color:var(--mute)}
.cost .no{color:var(--blood)}
.recruit{display:grid;grid-template-columns:45px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.recruit:last-child{border-bottom:0}
.log{font-size:12.5px;color:var(--mute);display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.log .d{font-family:var(--f-num);font-size:10.5px;color:var(--dim);margin-right:6px}
.notice{border-left:3px solid var(--torch);padding:6px 10px;background:var(--panel2);font-size:13px}
.notice.bad{border-color:var(--blood)}
.sub{font-family:var(--f-title);color:var(--ink);font-size:15px;margin-top:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px;color:var(--mute)}
.kv b{color:var(--ink);font-weight:500}
.dun{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:920px){.dun{grid-template-columns:1fr}}
.dmain{display:flex;flex-direction:column;gap:16px;min-width:0}
.mapbox{overflow-x:auto;padding:6px 2px}
.map{display:grid;justify-content:center;align-items:center;--cell:clamp(44px,12vw,68px);--gap:clamp(8px,2.6vw,18px);margin:0 auto;width:max-content}
.map.w5{--cell:clamp(38px,10.5vw,60px);--gap:clamp(6px,2vw,14px)}
.room{width:var(--cell);height:var(--cell);border:2px solid #2a221a;background:var(--void);display:grid;place-items:center;font-family:var(--f-title);font-size:clamp(16px,4vw,22px);color:var(--dim);border-radius:5px;padding:0;position:relative}
.room.known{background:#241d16;color:var(--mute);border-color:var(--line)}
.room.visited{background:#3a2e22;color:var(--ink);border-color:#56462f}
.room.cleared{color:var(--mute)}
.room.threat{color:#f08a74}
.room.safe{color:var(--good)}
.room.cur{border-color:var(--torch);box-shadow:0 0 0 3px rgba(230,160,59,.22),inset 0 0 20px rgba(230,160,59,.22);color:var(--torch-hi)}
.room.can{cursor:pointer;border-style:dashed;border-color:var(--mute)}
.room.can:hover{border-color:var(--torch-hi);background:#3f3122}
.room .cnt{position:absolute;right:3px;bottom:1px;font-family:var(--f-num);font-size:10px;color:#f08a74}
.room .fz{position:absolute;left:3px;top:1px;width:6px;height:6px;border-radius:2px;background:var(--fz,transparent)}
.corr-h{height:6px;background:#4a3c2c;border-radius:2px}
.corr-v{width:6px;height:var(--gap);background:#4a3c2c;margin:0 auto;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--dim);justify-content:center;margin-top:4px}
.legend summary{cursor:pointer;text-align:center;list-style:none;color:var(--dim);font-size:11.5px}
.legend summary::-webkit-details-marker{display:none}
.legend summary::after{content:' ▾'}
.legend[open] summary::after{content:' ▴'}
.legend span{display:none}
.legend[open] span{display:inline}
.legend[open]{gap:4px 12px;padding-top:4px}
.legend b{font-family:var(--f-title);color:var(--mute);margin-right:3px}
.event h3{font-size:18px;color:var(--ink)}
.event .desc{color:var(--mute)}
.foes{display:flex;flex-wrap:wrap;gap:8px}
.foe{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mute);background:var(--void);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:76px}
.foe img{image-rendering:pixelated;height:42px;width:auto}
.foe.elite{border-color:#7a3a2c;color:#f0a090}
.mini{display:grid;grid-template-columns:45px 1fr;gap:8px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mini:last-child{border-bottom:0}
.mini .mname b{font-size:14px}
.loot{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;font-size:13px;color:var(--mute)}
.loot b{font-family:var(--f-num);font-weight:400;color:var(--ink);font-size:12px;margin-left:4px}
.stairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stair{font:inherit;text-align:left;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.stair b{font-family:var(--f-title);font-size:16px;color:var(--torch-hi)}
.stair small{color:var(--mute);font-size:12px}
.stair.fate{border-color:#8a5ac0}
.stair.fate b{color:#d0a8ff}
.stair:hover{border-color:var(--torch)}
.bt{position:relative;max-width:600px;margin:0 auto;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column}
.bt-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:var(--panel2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bt-top h2{font-size:16px}
.order{display:flex;gap:4px;align-items:center;padding:6px 10px;background:var(--void);overflow-x:auto;border-bottom:1px solid var(--line)}
.order .lbl{font-size:11px;color:var(--dim);margin-right:4px;white-space:nowrap}
.oi{flex:none;width:30px;height:30px;border-radius:5px;border:2px solid var(--line);background:#1a1510;display:grid;place-items:center;overflow:hidden}

@media (max-width:720px){
  /* 外框固定(html/body 鎖死成整個視窗大小),只有 #screen 內部捲動。
     這樣切分頁、內容變長變短都只影響 #screen 的內部捲軸,
     不會動到整個網頁的高度,瀏覽器也就不會因為頁面高度變化重新計算
     工具列/縮放,不會再出現「切分頁畫面跳一下」的狀況。 */
  html,body{height:100%;overflow:hidden}
  body{display:flex;flex-direction:column;overscroll-behavior:none}
  .top{position:static;flex:none}
  #screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

  .dun{display:flex;flex-direction:column;gap:12px;padding-bottom:calc(42vh + 10px)}

  .bt{position:fixed;inset:0;max-width:none;margin:0;border:0;border-radius:0;z-index:20;height:100dvh}

  .cmd{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .cmdb{padding:9px 10px}
  body:has(.bt){overflow:hidden}
}

function essInfo(it){const d=ESS[it.k],mul=it.gd?1.5:1,st={};for(const[s,v]of Object.entries(d.st))st[s]=Math.round(v*mul*100)/100;
  const acts=it.gd?d.acts.slice():[d.acts[it.c%d.acts.length]];
  const col=it.gd?['虹','']:COLORS[(d.acts.length>1?it.c:it.c)%COLORS.length];
  return{n:`${col[0]}色・${monName(it.k)}精髓`,short:`${monName(it.k)}精髓`,g:d.g,st,acts,pas:d.pas||null,color:col[1],gd:it.gd};}
function essDesc(it){const e=essInfo(it),p=[],lb={hp:'生命',atk:'攻擊',def:'防禦',spd:'速度',soul:'魂力',mres:'魔抗'};
  for(const[s,v]of Object.entries(e.st)){if(lb[s])p.push(`${lb[s]} ${v>0?'+':''}${v}`);else if(s==='ls')p.push(`吸血 ${Math.round(v*100)}%`);else if(s==='regen')p.push(`再生 ${Math.round(v*100)}%`);}
  return `${e.g}級${e.gd?'・守護者':''}。${p.join('、')}。主動「${e.acts.map(a=>SK[a].n).join('」「')}」${e.pas?`;被動「${PS[e.pas].n}」`:''}`;}
function essSkillDesc(it){const e=essInfo(it);return e.acts.map(a=>`「${SK[a].n}」${SK[a].d}(魂力 ${SK[a].cost})`).join('<br>')+(e.pas?`<br>被動「${PS[e.pas].n}」${PS[e.pas].d}`:'');}
const essSlots=m=>m.lv;
function memberActs(m){return[...new Set(m.ess.flatMap(it=>essInfo(it).acts))];}

function absorbCheck(m,it){
  const e=essInfo(it);

  if(it.gd&&up>=0)return{ok:true,upgrade:up};

}

function genName(race){

function makeMember(o={}){
  const race=o.race||pick(Object.keys(RACE)),weapon=o.weapon||pick(Object.keys(WEAPON));
  let traits=o.traits;
  if(!traits){traits=[];const n=Math.random()<0.45?2:1;let g=0;while(traits.length<n&&g++<50){const t=pick(RANDOM_TRAITS);if(!traits.includes(t)&&!traits.includes(CLASH[t]))traits.push(t);}}
  const m={id:S.uid++,name:o.name||genName(race),race,weapon,lv:o.lv||1,xp:LV_XP[o.lv||1]||0,hp:1,soul:0,stress:0,wpn:0,arm:0,traits,ess:o.ess||[],kills:[],floors:[],job:'rest',look:o.look??ri(0,5),num:null,bonusSoul:0};
  const st=stats(m);m.hp=st.maxhp;m.soul=st.soul;return m;
}
function stats(m){
  const w=WEAPON[m.weapon],r=RACE[m.race];
  let hp=w.hp*(r.hp||1),atk=w.atk+(r.atk||0),def=w.def+(r.def||0),spd=w.spd+(r.spd||0),soul=40+(w.soul||0)+(r.soul||0)+(m.bonusSoul||0),mres=r.mres||0,crit=.05+(w.crit||0),ls=0,regen=0;
  const L=m.lv-1;hp*=1+.07*L;atk+=1.2*L;def+=.5*L;soul+=Math.min(L,4)*10+Math.max(0,L-4)*30;spd+=L*.5;
  atk+=m.wpn*3;def+=m.arm*2;hp+=m.arm*12;
  for(const it of m.ess){const e=essInfo(it).st;hp+=e.hp||0;atk+=e.atk||0;def+=e.def||0;spd+=e.spd||0;soul+=e.soul||0;mres+=e.mres||0;ls+=e.ls||0;regen+=e.regen||0;}
  if(memberPas(m).includes('preserve'))regen+=.03;
  if(memberPas(m).includes('scent'))crit+=.06;
  if(m.num){const f=NUM[m.num.id].eff;atk+=f.atk||0;def+=f.def||0;spd+=f.spd||0;soul+=f.soul||0;mres+=f.mres||0;ls+=f.ls||0;regen+=f.regen||0;crit+=f.crit||0;}
  if(hasT(m,'tough'))hp*=1.15;if(hasT(m,'quick'))spd+=6;if(hasT(m,'pacifist'))atk*=.75;if(hasT(m,'bg_merc'))atk+=3;
  return{maxhp:Math.max(10,Math.round(hp)),atk:Math.max(1,Math.round(atk*10)/10),def:Math.max(0,Math.round(def*10)/10),spd:Math.max(40,Math.round(spd)),soul:Math.round(soul),mres:Math.round(mres),crit,ls,regen};
}
function essValue(m){return m.ess.reduce((a,it)=>a+GRADE[ESS[it.k].g].ev*(it.gd?1.5:1),0);}
function essGrade(m){const v=essValue(m);return v<4?9:v<12?8:v<35?7:v<90?6:v<220?5:4;}
const rankCap=()=>S.examPassed?4:S.contrib>=30?6:7;
function expGrade(m){return Math.max(essGrade(m),rankCap());}
function stressMult(m){let k=1;if(hasT(m,'brave'))k*=.7;if(hasT(m,'coward'))k*=1.4;if(hasT(m,'bg_drifter'))k*=.7;if(m.race==='barb')k*=.85;return k;}
function addStress(m,v){m.stress=clamp(m.stress+(v>0?v*stressMult(m):v),0,100);}
function gainXp(m,xp){m.xp+=xp;const ups=[];while(m.lv<MAXLV&&m.xp>=LV_XP[m.lv+1]){const r=m.hp/stats(m).maxhp;m.lv++;m.hp=Math.round(r*stats(m).maxhp);ups.push(m.lv);}return ups;}

const OUT='#140f0b',SPR={},URL_CACHE={};
function gridCanvas(grid,pal,sc){
  const h=grid.length,w=Math.max(...grid.map(r=>r.length)),W=w+2,H=h+2;
  const px=Array.from({length:H},()=>Array(W).fill(null));
  for(let y=0;y<h;y++)for(let x=0;x<grid[y].length;x++){const ch=grid[y][x];if(ch!=='.'&&pal[ch])px[y+1][x+1]=pal[ch];}
  const out=px.map(r=>r.slice());
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(!px[y][x]){if((px[y-1]&&px[y-1][x])||(px[y+1]&&px[y+1][x])||px[y][x-1]||px[y][x+1])out[y][x]=OUT;}
  const cv=document.createElement('canvas');cv.width=W*sc;cv.height=H*sc;const g=cv.getContext('2d');
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(out[y][x]){g.fillStyle=out[y][x];g.fillRect(x*sc,y*sc,sc,sc);}
  return cv;
}
function humanoid(o){
  const W=13,H=15,g=Array.from({length:H},()=>Array(W).fill('.'));
  const set=(x,y,c)=>{if(x>=0&&x<W&&y>=0&&y<H)g[y][x]=c;};
  const rect=(x0,y0,x1,y1,c)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)set(x,y,c);};
  rect(4,2,7,4,'s');rect(4,1,7,1,'h');set(4,2,'h');set(3,2,'h');set(3,3,'h');
  if(o.helm){rect(3,1,8,1,'m');rect(4,0,7,0,'m');set(3,2,'m');set(3,3,'m');}
  if(o.hood){rect(3,0,8,1,'b');set(3,2,'b');set(3,3,'b');set(3,4,'b');set(8,2,'b');}
  set(6,3,'e');
  if(o.beard)rect(4,4,7,5,'h');
  if(o.horns){set(3,0,'n');set(8,0,'n');set(2,0,'n');set(9,0,'n');if(!o.helm)rect(3,1,8,1,'m');}
  if(o.ears==='elf')set(2,3,'s');
  if(o.ears==='beast'){set(4,0,'h');set(7,0,'h');}
  if(o.wings){rect(0,4,1,7,'q');set(0,3,'q');}
  rect(3,5,8,9,'b');rect(3,8,8,8,'t');
  rect(2,5,2,8,'b');set(2,9,'s');rect(9,5,9,7,'b');set(9,8,'s');
  if(o.robe){rect(3,9,8,12,'b');rect(2,11,9,12,'b');set(4,13,'f');set(7,13,'f');}
  else{rect(4,10,5,12,'l');rect(6,10,7,12,'l');rect(4,13,5,13,'f');rect(6,13,7,13,'f');}
  switch(o.weapon){
    case'shield':rect(9,5,11,11,'w');rect(10,6,10,10,'x');break;
    case'hammer':rect(10,3,10,12,'y');rect(9,0,12,2,'x');break;
    case'sword':rect(10,0,10,7,'x');rect(9,8,11,8,'y');set(10,9,'y');break;
    case'spear':rect(11,2,11,13,'y');rect(11,0,11,1,'x');set(10,1,'x');set(12,1,'x');break;
    case'daggers':rect(10,5,10,8,'x');set(10,9,'y');rect(1,7,1,9,'x');break;
    case'bow':set(10,1,'y');set(11,2,'y');rect(12,3,12,8,'y');set(11,9,'y');set(10,10,'y');rect(10,2,10,9,'q');break;
    case'staff':rect(10,2,10,13,'y');rect(9,0,11,1,'o');break;
    case'club':rect(10,2,11,7,'w');set(10,8,'y');break;
  }
  return g.map(r=>r.join(''));
}

const TAVERN_TIERS=[
  {lv:1,cond:()=>true,w:5,label:''},
  {lv:2,cond:()=>true,w:4,label:''},
  {lv:3,cond:s=>s.fame>=15,w:3,label:'名聲達到 15'},
  {lv:4,cond:s=>s.fame>=35&&s.contrib>=20,w:2,label:'名聲 35、貢獻點 20'},
  {lv:5,cond:s=>s.fame>=60&&s.contrib>=30,w:1.4,label:'名聲 60、貢獻點 30(公會 6 級認證)'},
  {lv:6,cond:s=>s.fame>=90&&s.maxFloor>=3,w:1,label:'名聲 90、抵達過第 3 層'},
  {lv:7,cond:s=>s.fame>=130&&s.maxFloor>=5&&s.contrib>=80,w:.7,label:'名聲 130、抵達過第 5 層、貢獻點 80'}
];
function tavernUnlocked(){return TAVERN_TIERS.filter(t=>t.cond(S));}
function recruitCost(m){return 150+m.lv*80+m.ess.length*120;}
function refreshTavern(){
  const unlocked=tavernUnlocked();
  S.tavern=Array.from({length:4},()=>{
    const totalW=unlocked.reduce((a,t)=>a+t.w,0);let r=Math.random()*totalW,tier=unlocked[unlocked.length-1];
    for(const t of unlocked){if(r<t.w){tier=t;break;}r-=t.w;}
    const ess=Math.random()<.2+tier.lv*.05?[makeEss(pick(['goblin','ghoul','gnome','bladewolf','kobold','goblin_archer']))]:[];
    return makeMember({lv:tier.lv,ess});
  });
}

}
ACT.recruit=id=>{const m=S.tavern.find(x=>x.id===+id);if(!m)return;const c=recruitCost(m);if(S.stone<c||living().length>=capacity())return;S.stone-=c;S.members.push(m);S.tavern=S.tavern.filter(x=>x!==m);log(`${m.name}(${RACE[m.race].n}・${WEAPON[m.weapon].n})在酒館加入了隊伍。`);save();render();};
/* --- guild --- */
const REQ_DESC=r=>r.type==='kill'?`討伐 ${monName(r.k)} ×${r.n}`:r.type==='reach'?`抵達第 ${r.f} 層`:r.type==='deliver'?`繳交一顆${monName(r.k)}精髓`:r.type==='rift'?'清除任意一個裂縫':'';
function reqProgress(r){if(r.type==='kill')return Math.min(r.n,(S.kc[r.k]||0)-r.base);if(r.type==='reach')return S.maxFloor>=r.f?1:0;if(r.type==='rift')return S.riftsCleared>r.base?1:0;if(r.type==='deliver')return S.bag.some(it=>it.k===r.k)?1:0;return 0;}
function reqDone(r){return reqProgress(r)>=(r.type==='kill'?r.n:1);}
function genRequests(){
  const f=Math.min(6,S.maxFloor),pools=[];for(const[k,fd]of Object.entries(FIELDS)){const fl=fieldFloor(k);if(fl&&fl<=Math.min(6,f+1))pools.push(...fd.pool);}
  const out=[];const mk=()=>{const t=pick(['kill','kill','kill','deliver','reach','rift']);
    if(t==='kill'){const k=pick(pools.length?pools:['goblin']);const g=MON[k].g;const n=g>=9?ri(3,6):ri(1,3);return{type:'kill',k,n,stone:GRADE[g].stone*n*3+60,contrib:g>=9?3:6,fame:1};}
    if(t==='deliver'){const k=pick(Object.keys(ESS).filter(e=>ESS[e].g===9));return{type:'deliver',k,stone:550,contrib:6,fame:2};}
    if(t==='reach'&&f<6)return{type:'reach',f:f+1,stone:250*f,contrib:10,fame:3};
    return{type:'rift',stone:600,contrib:12,fame:5};};
  for(let i=0;i<3;i++){const r=mk();r.id=S.uid++;out.push(r);}S.reqs=out;
}
function fieldFloor(k){return({ccN:1,ccS:1,ccE:1,ccW:1,beast:2,dead:2,desert:2,gforest:2,steelhill:3,orc:3,marsh:3,estuary:3,witch:3,tower:4,hellfire:5,frost:5,specter:5,calmsea:6,doldrums:6,icesea:6})[k];}
function refreshShop(){const cap=rankCap(),gmax=cap<=4?6:cap<=6?7:8;const pool=Object.keys(ESS).filter(k=>!ESS[k].guard&&ESS[k].g<=8&&ESS[k].g>=gmax&&!k.startsWith('abyss'));
  S.shop=shuffle(pool).slice(0,3).map(k=>makeEss(k));}
function guildTab(){
  const cap=rankCap();
  const canExam=S.contrib>=80&&!S.examPassed;
  return `<div class="kv"><span>公會認證</span><b>${cap===7?'最高可認定為 7 級':cap===6?'中堅(可認定到 6 級)':'考試合格(可認定到 4 級)'}</b><span>貢獻點</span><b>${S.contrib}${S.contrib<30?'(滿 30 通過 6 級審查)':S.examPassed?'':'(滿 80 可報考 5 級)'}</b><span>名聲</span><b>${S.fame}</b></div>
    ${canExam?`<button class="btn primary" data-act="exam">報考 5 級晉級考試(與考官交手)</button>`:''}
    <div class="sub">委託(每月 1 日更新)</div>
    <div class="list">${S.reqs.map(r=>`<div class="item"><span>${REQ_DESC(r)}</span><button class="btn sm" data-act="acceptReq" data-arg="${r.id}" ${S.active.length<3?'':'disabled'}>接受</button><small>報酬 ${r.stone} 石幣、貢獻 ${r.contrib}、名聲 ${r.fame}</small></div>`).join('')||'<p class="mute">這個月的委託都被接走了。</p>'}</div>
    ${S.active.length?`<div class="sub">進行中</div><div class="list">${S.active.map(r=>{const done=reqDone(r);return `<div class="item"><span>${REQ_DESC(r)} <span class="mute">${r.type==='kill'?`${Math.max(0,reqProgress(r))}/${r.n}`:done?'可以回報':''}</span></span><button class="btn sm ${done?'primary':''}" data-act="claimReq" data-arg="${r.id}" ${done?'':'disabled'}>回報</button></div>`;}).join('')}</div>`:''}
    <div class="sub">精髓交易(8 級以上,公會認證越高能買越高級)</div>
    <div class="list">${S.shop.map((it,i)=>`<div class="item">${essChip(it)}<button class="btn sm" data-act="buyGuildEss" data-arg="${i}" ${S.stone>=GRADE[ESS[it.k].g].price?'':'disabled'}>${GRADE[ESS[it.k].g].price}</button><small>${essDesc(it)}</small></div>`).join('')||'<p class="mute">這個月的精髓賣完了。</p>'}</div>`;
}
ACT.acceptReq=id=>{const r=S.reqs.find(x=>x.id===+id);if(!r||S.active.length>=3)return;if(r.type==='kill')r.base=S.kc[r.k]||0;if(r.type==='rift')r.base=S.riftsCleared;S.active.push(r);S.reqs=S.reqs.filter(x=>x!==r);save();render();};
ACT.claimReq=id=>{const r=S.active.find(x=>x.id===+id);if(!r||!reqDone(r))return;
  if(r.type==='deliver'){const i=S.bag.findIndex(it=>it.k===r.k);if(i<0)return;S.bag.splice(i,1);}
  S.stone+=r.stone;S.contrib+=r.contrib;S.fame+=r.fame;S.active=S.active.filter(x=>x!==r);log(`完成委託「${REQ_DESC(r)}」,得到 ${r.stone} 石幣、貢獻 ${r.contrib}。`);
  if(S.contrib>=30&&S.contrib-r.contrib<30)log('貢獻點滿 30,公會審查通過,認證上限提高到 6 級。');
  save();render();};
ACT.buyGuildEss=i=>{const it=S.shop[+i];if(!it)return;const p=GRADE[ESS[it.k].g].price;if(S.stone<p)return;S.stone-=p;S.bag.push(it);S.shop.splice(+i,1);log(`在公會買下${essInfo(it).n}。`);save();render();};
ACT.exam=()=>{const party=S.sel.map(getM).filter(m=>m&&!m.dead);if(!party.length){toast('先勾選要參加考試的隊員');return;}startBattle(['examiner'],{exam:1});};
/* --- library --- */
const LIB_ESS=['goblin','ghoul','gnome','bladewolf','kobold','kobold_shield','goblin_archer','goblin_sword','skel_archer','skel_warrior','banshee','wall_mole'];
function libraryTab(){
  const seen=new Set();for(const[k,fd]of Object.entries(FIELDS)){const fl=fieldFloor(k);if(fl&&fl<=Math.min(6,S.maxFloor+1))fd.pool.forEach(x=>seen.add(x));}

    <div class="sub">9 級精髓(顏色隨機)</div>
    <div class="list">${LIB_ESS.map(k=>`<div class="item"><span>${monName(k)}精髓</span><button class="btn sm" data-act="buyLibEss" data-arg="${k}" ${S.stone>=GRADE[9].price?'':'disabled'}>${GRADE[9].price}</button><small>${ESS[k].acts.map(a=>`「${SK[a].n}」`).join('或')}${ESS[k].pas?`;被動「${PS[ESS[k].pas].n}」`:''}</small></div>`).join('')}</div>
    <div class="sub">怪物圖鑑(${S.known.length})</div>
    <div class="list">${S.known.map(k=>{const d=MON[k];return `<div class="item"><span>${d.n} <span class="lv">${d.g}級</span></span><span class="wk">${(d.weak||[]).map(x=>`<span>${DT[x]}</span>`).join('')}${(d.resist||[]).map(x=>`<span class="rs">${DT[x]}</span>`).join('')}${d.tags&&d.tags.spirit?'<span class="sp">靈體</span>':''}</span><small>${monNote(k)}</small></div>`;}).join('')}</div>`;
}
function monNote(k){const t=MON[k].tags||{},n=[];
  if(t.passive)n.push('不會主動攻擊');if(t.spirit)n.push('靈體,物理攻擊幾乎無效');if(t.poison)n.push('攻擊帶毒');if(t.stealth)n.push('會融入周圍隱身');if(t.curse)n.push('先出手攻擊會被下「怨恨之印」');
  if(t.bind)n.push('會束縛對手');if(t.heal)n.push('會治療同伴');if(t.buff)n.push('會強化同伴');if(t.fear)n.push('會讓人恐懼');if(t.silence)n.push('會下沉默,封鎖精髓技能');if(t.enrage)n.push('生命降低時會覺醒,越打越強');if(t.summon)n.push(`會召喚${monName(t.summon)}`);if(t.drain)n.push('攻擊時吸血');if(t.noheal)n.push('傷口難以癒合');
  if(MON[k].atkdt)n.push(`${DT[MON[k].atkdt]}屬性攻擊`);return n.join('、')||'沒有特別的能力';}

function processDays(n,away=new Set()){
  for(let d=0;d<n;d++){
    let earn=0;
    for(const m of living()){
      if(away.has(m.id))continue;const st=stats(m);
      if(m.job==='work'){const k=hasT(m,'diligent')?1.5:hasT(m,'lazy')?.5:1;earn+=Math.round(8*k);m.hp=Math.min(st.maxhp,m.hp+st.maxhp*.15);m.stress=Math.max(0,m.stress-3);}
      else{m.hp=Math.min(st.maxhp,m.hp+st.maxhp*.35);m.stress=Math.max(0,m.stress-(15+S.dorm*6)*(hasT(m,'insomniac')?.5:1));}
      m.soul=st.soul;
    }
    S.stone+=earn;
    if(!S.carnon&&S.fame>=150){S.carnon=true;log('名聲傳到了拉夫多尼亞第 1 區,卡隆的守衛不再攔你——身為受認可的探險者,每天的生活開銷降了一些。');}
    const cost=living().reduce((a,m)=>a+livingCost(m),0);
    if(S.stone>=cost)S.stone-=cost;else{S.stone=0;living().forEach(m=>{addStress(m,10);m.hp=Math.max(1,m.hp-stats(m).maxhp*.1);});log('付不出生活費,大家餓著肚子過了一天。');}
    S.day++;
    if(S.day>DAYS_IN_MONTH){S.day=1;S.month++;
      const tax=living().reduce((a,m)=>a+taxOf(m),0)+S.debt;
      if(S.stone>=tax){S.stone-=tax;S.debt=0;if(tax)log(`第 ${S.month} 月開始,繳了 ${tax} 石幣的稅。`);}
      else{S.debt=tax-S.stone;S.stone=0;log(`稅金不夠繳,還欠 ${S.debt} 石幣。欠稅的人進不了次元廣場。`);}
      genRequests();refreshShop();
    }
    if(S.day===1||S.day===15)refreshTavern();
  }
}
function payDebt(){if(S.debt&&S.stone>=S.debt){S.stone-=S.debt;log(`補繳了 ${S.debt} 石幣的稅。`);S.debt=0;}}
function checkGameOver(){const h=hero();if(!living().length&&(!h||S.stone<reviveCost())){S.screen='over';save();render();}}

  ${S.fallen.length?`<div class="panel"><h2>倒在迷宮裡的人</h2><div class="log">${S.fallen.map(f=>`<div><span class="d">${f.d}</span>${f.name}(Lv${f.lv})</div>`).join('')}</div></div>`:''}

}

ACT.absorbOpen=arg=>{

  modal(`吸收 ${essInfo(it).n}`,`<p class="mute" style="margin-bottom:8px">${essDesc(it)}</p><p style="font-size:13px;margin-bottom:8px">${essSkillDesc(it)}</p><div class="list">${rows}</div><p class="mute" style="font-size:12px;margin-top:6px">槽滿或技能重複的人,要先到大神殿移除舊精髓。</p>`,[{label:'取消',act:'closeModal'}]);

ACT.absorbDo=arg=>{
  const[src,i,id]=arg.split(':');const list=src==='bag'?S.bag:S.run.loot.ess;const it=list[+i];const m=getM(id);if(!it||!m)return;
  const c=absorbCheck(m,it);if(!c.ok)return;const before=stats(m);
  if(c.upgrade!==undefined)m.ess.splice(c.upgrade,1,it);else m.ess.push(it);
  list.splice(+i,1);const after=stats(m);
  m.hp=Math.min(after.maxhp,m.hp+Math.max(0,after.maxhp-before.maxhp));m.soul=Math.min(after.soul,m.soul+Math.max(0,after.soul-before.soul));
  log(`${m.name} 吸收了${essInfo(it).n},學會「${essInfo(it).acts.map(a=>SK[a].n).join('」「')}」。`);ACT.closeModal();save();render();
};

/* ================= LABYRINTH ================= */
const partyMembers=()=>S.run?S.run.party.map(getM).filter(m=>m&&!m.dead):[];
const runHas=eff=>partyMembers().some(m=>m.num&&NUM[m.num.id].eff[eff]);
function genEnemies(field,kind){
  const fd=FIELDS[field],pool=fd.pool.length?fd.pool:['goblin'];
  if(kind==='elite'){const el=fd.elite||[pick(pool)];const e=Math.random()<.75?el[0]:pick(el);return[e,pick(pool),pick(pool)];}
  if(kind==='bandit')return Array.from({length:ri(2,3)},()=>pick(['bandit','bandit','bandit_archer']));
  const f=fieldFloor(field)||1;let n=clamp(2+ri(0,Math.ceil(f/2))+(fd.dense?1:0),2,5);
  return Array.from({length:n},()=>pick(pool));
}
function abyssEnemies(){const e=['abyss_goblin','abyss_ghoul','abyss_gnome','abyss_bladewolf'];return[pick(e),'abyss_watcher','abyss_watcher'];}
function makeGrid(W,H,s0){
  const N=W*H,rooms=[...Array(N)].map((_,i)=>({x:i%W,y:Math.floor(i/W),type:'empty',visited:false,cleared:false,links:[]}));
  const link=(a,b)=>{if(a!==b&&!rooms[a].links.includes(b)){rooms[a].links.push(b);rooms[b].links.push(a);}};
  const nb=i=>{const x=i%W,y=Math.floor(i/W),o=[];if(x>0)o.push(i-1);if(x<W-1)o.push(i+1);if(y>0)o.push(i-W);if(y<H-1)o.push(i+W);return o;};
  const seen=new Set([s0]),stack=[s0];
  while(stack.length){const c=stack[stack.length-1];const opts=nb(c).filter(n=>!seen.has(n));if(!opts.length){stack.pop();continue;}const n=pick(opts);link(c,n);seen.add(n);stack.push(n);}
  for(let k=0;k<Math.ceil(N/4);k++){const a=ri(0,N-1);link(a,pick(nb(a)));}
  return rooms;
}
function bfs(rooms,s){const d=Array(rooms.length).fill(-1);d[s]=0;const q=[s];while(q.length){const c=q.shift();for(const n of rooms[c].links)if(d[n]<0){d[n]=d[c]+1;q.push(n);}}return d;}
function fillRooms(rooms,ids,f){
  const bag=['combat','combat','combat','combat','combat','resource','resource','chest','trap','spring','empty'];
  ids=shuffle(ids.slice());let k=0;
  if(f>=2&&ids.length>k&&Math.random()<.7)rooms[ids[k++]].type='elite';
  if(ids.length>k&&Math.random()<.45){const opts=Object.entries(RIFTS).filter(([rk,r])=>r.f===f&&(S.riftCD[rk]||0)<=S.month);if(opts.length){const r=rooms[ids[k++]];r.type='altar';r.rift=pick(opts)[0];}}
  if(ids.length>k&&Math.random()<.3)rooms[ids[k++]].type='merchant';
  for(;k<ids.length;k++){let t=pick(bag);const fd=FIELDS[rooms[ids[k]].field];if(t==='trap'&&fd&&fd.traps===0)t='combat';if(fd&&fd.traps>=3&&Math.random()<.25)t='trap';rooms[ids[k]].type=t;}
  for(const r of rooms){
    if(r.type==='combat'||r.type==='elite')r.enemies=genEnemies(r.field,r.type);
    if(r.type==='chest'&&Math.random()<.12){r.mimic=true;r.enemies=genEnemies(r.field,'combat');}
  }
}
function genFloor(f,opt={}){
  let W,H,rooms,start;
  if(f===1){
    W=5;H=5;const c=12;rooms=makeGrid(W,H,c);
    rooms.forEach((r,i)=>{const dx=r.x-2,dy=r.y-2;r.field=!dx&&!dy?'ccC':Math.abs(dx)>Math.abs(dy)?(dx>0?'ccE':'ccW'):Math.abs(dy)>Math.abs(dx)?(dy>0?'ccS':'ccN'):pick([dx>0?'ccE':'ccW',dy>0?'ccS':'ccN']);});
    rooms[c].type='sage';rooms[c].cleared=true;
    const tips={2:'gforest',22:'dead',14:'beast',10:'desert'};
    for(const[i,to]of Object.entries(tips)){rooms[i].type='portal';rooms[i].to=to;}
    const cand=rooms.map((_,i)=>i).filter(i=>i!==c&&!tips[i]);
    start=pick(cand);rooms[start].type='entry';
    fillRooms(rooms,cand.filter(i=>i!==start),1);
    if(opt.abyss)rooms.forEach(r=>{if((r.type==='combat'||r.type==='elite')&&(Math.abs(r.x-2)===2||Math.abs(r.y-2)===2))r.enemies=abyssEnemies();});
  }else if(f===2){
    W=4;H=3;start=ri(0,W*H-1);rooms=makeGrid(W,H,start);rooms.forEach(r=>r.field=opt.field||'dead');
    rooms[start].type='entry';const d=bfs(rooms,start);let far=0;d.forEach((v,i)=>{if(v>d[far])far=i;});rooms[far].type='stairs';
    fillRooms(rooms,rooms.map((_,i)=>i).filter(i=>i!==start&&i!==far),2);
  }else if(f===3){
    W=5;H=4;rooms=null;
    const fieldOf=(x,y)=>x>=1&&x<=3&&y>=1&&y<=2?'witch':x<=1&&y<=1?'steelhill':x>=3&&y<=1?'orc':x<=1?'marsh':x>=3?'estuary':y===0?pick(['steelhill','orc']):pick(['marsh','estuary']);
    const outer=[];for(let i=0;i<W*H;i++){const x=i%W,y=Math.floor(i/W);if(!(x>=1&&x<=3&&y>=1&&y<=2))outer.push(i);}
    start=pick(outer);rooms=makeGrid(W,H,start);rooms.forEach(r=>r.field=fieldOf(r.x,r.y));
    rooms[start].type='entry';
    const witchIdx=rooms.map((r,i)=>i).filter(i=>rooms[i].field==='witch');const d=bfs(rooms,start);
    const portal=witchIdx.reduce((a,b)=>d[b]>d[a]?b:a,witchIdx[0]);rooms[portal].type='stairs';
    const hut=pick(witchIdx.filter(i=>i!==portal));rooms[hut].type='hut';rooms[hut].cleared=true;
    fillRooms(rooms,rooms.map((_,i)=>i).filter(i=>i!==start&&i!==portal&&i!==hut),3);
  }else if(f===5){
    W=5;H=3;start=7;rooms=makeGrid(W,H,start);
    rooms.forEach(r=>r.field=r.x<2?'hellfire':r.x>2?'frost':'specter');rooms[start].field='redstart';rooms[start].type='redstart';rooms[start].cleared=true;rooms[start].visited=true;
    const g=pick([2,12]);rooms[g].type='f6gate';
    fillRooms(rooms,rooms.map((_,i)=>i).filter(i=>i!==start&&i!==g),5);
  }else if(f===6){
    W=5;H=3;start=7;rooms=makeGrid(W,H,start);
    rooms.forEach(r=>r.field=r.x<2?'calmsea':r.x>2?'icesea':'doldrums');rooms[start].field='seaport';rooms[start].type='seaport';rooms[start].cleared=true;rooms[start].visited=true;
    fillRooms(rooms,rooms.map((_,i)=>i).filter(i=>i!==start),6);
  }
  rooms[start].visited=true;rooms[start].cleared=true;
  return{f,W,H,rooms,start,cur:start};
}
const stayLimit=run=>FLOORS[run.floor].stay*24;
const curField=run=>run.tower?'tower':run.map.rooms[run.map.cur].field;
ACT.enterLab=()=>{
  payDebt();
  const party=S.sel.map(getM).filter(m=>m&&!m.dead);if(!party.length||S.day!==1||S.debt)return;
  const f=clamp(S.startFloor,1,S.maxFloor);party.forEach(m=>{m.soul=stats(m).soul;});
  S.run={party:party.map(m=>m.id),floor:f,h:0,loot:{stone:0,ess:[],items:[]},prev:null,torchH:0,curse:false,witchH:0,abyss:false,collapse:null,tower:null,orb:false};
  if(f===1&&((S.dreadKills||0)>=9||Math.random()<.01))S.run.abyss=true;
  setupFloor(f,f===2?pick(['beast','dead','desert','gforest']):null);
  if(Math.random()<.015)S.run.collapsePending=true;
  S.screen='dungeon';
  log(`${party.map(m=>m.name).join('、')} 穿過次元廣場的傳送門,來到第 ${f} 層${FLOORS[f].n}。`);
  save();render();
  const msgs=portalXp(party,f);
  if(S.run.abyss)modal('深淵之主',`<p>水晶洞窟外圍的黑暗裡傳來不屬於這一層的氣息。深淵之主貝爾札克來了,外圍的怪物變成了 5 級的深淵變種。</p><p class="mute" style="margin-top:6px">中心部附近還算安全。</p>${msgs.join('')}`);
  else if(msgs.length)modal('開啟新的傳送門',msgs.join(''));
};
function setupFloor(f,field){
  const run=S.run;run.floor=f;
  if(f===4){run.tower={stage:0,choices:towerChoices()};run.map=null;run.prev=null;}
  else{run.tower=null;run.map=genFloor(f,{field,abyss:run.abyss&&f===1});run.prev=run.map.start;run.field2=field;}
  S.maxFloor=Math.max(S.maxFloor,f);
  autoTorch();
}
function portalXp(party,f){const out=[];for(const m of party){if(!m.floors.includes(f)){m.floors.push(f);let extra='';
  if(f===5){m.bonusSoul=(m.bonusSoul||0)+20;extra=',首次踏入大魔境的成就讓魂力永久 +20';}
  const ups=gainXp(m,2);out.push(`<p>${m.name} 第一次開啟第 ${f} 層的傳送門,經驗 +2${extra}${ups.length?`,<span style="color:var(--torch-hi)">升到 Lv${m.lv}!多了 ${ups.length} 個精髓槽</span>`:''}</p>`);}}
  if(out.length&&f>1)S.fame+=3;return out;}
function fieldDark(field){const fd=FIELDS[field];return fd&&fd.dark;}
function autoTorch(){const run=S.run;if(!run||run.tower)return;if(fieldDark(curField(run))&&run.torchH<=0&&S.torches>0){S.torches--;run.torchH=72;toast('點起了一支魔法火把');}}
const roomHasFoes=r=>!r.cleared&&(r.type==='combat'||r.type==='elite'||r.type==='rift');
function visible(map,i){
  const r=map.rooms[i];if(r.visited||r.seen)return true;
  const run=S.run,lit=!fieldDark(r.field)||run.torchH>0;
  const adj=r.links.some(j=>map.rooms[j].visited);
  if(adj&&lit)return true;
  if(runHas('sight')&&r.links.some(j=>map.rooms[j].links.some(k=>map.rooms[k].visited))&&lit)return true;
  return false;
}
const reachable=(map,i)=>map.rooms[i].visited||map.rooms[i].links.some(j=>map.rooms[j].visited);
function fmtH(h){const d=Math.floor(h/24),hh=Math.floor(h%24);return d?`${d} 天 ${hh} 小時`:`${hh} 小時`;}
function dungeonHTML(){
  const run=S.run,left=stayLimit(run)-run.h;
  const head=`<div class="panel-h"><h2>第 ${run.floor} 層 · ${run.tower?'天空之塔':FIELDS[curField(run)].n}</h2><span class="mute" style="font-size:12.5px">關閉倒數 <span class="num" style="color:${left<24?'var(--blood)':'var(--ink)'}">${fmtH(Math.max(0,left))}</span></span></div>${meter(left,stayLimit(run),'tm')}`;
  const notes=fieldNotes(run);
  const main=run.collapse?collapseHTML():run.tower?towerHTML():mapHTML();
  return `<div class="dun"><div class="dmain"><section class="panel">${head}${notes}${main.map||''}</section><section class="panel event">${main.event}</section></div>

  if(!run.tower&&FIELDS[curField(run)]?.fx==='witch')run.witchH+=h;
  if(run.floor===3&&!run.orb&&run.h>=72&&!run.tower){run.orb=true;run.map.rooms.forEach(r=>r.seen=true);toast('第 3 天,鋼岩丘陵的地面升起銀色光球,迷宮短暫地亮了起來!');}

  return false;

ACT.move=i=>{
  i=+i;const run=S.run,map=run.map,cur=map.rooms[map.cur];
  if(!cur.links.includes(i))return;if(roomHasFoes(cur)&&i!==run.prev){toast('怪物擋住了去路');return;}
  run.prev=map.cur;map.cur=i;
  const fx=FIELDS[map.rooms[i].field]?.fx,k=(fx==='witch'?1.5:1)+(run.curse?.6:0);partyMembers().forEach(m=>addStress(m,2.5*k));
  if(advanceTime(5))return;
  autoTorch();
  const r=map.rooms[i];if(!r.visited){r.visited=true;onEnter(r);}
  if(run.collapsePending&&run.h>=24){run.collapsePending=false;run.collapse={wave:0,total:3+run.floor};log('次元崩壞發生了!');save();render();modal('次元崩壞','<p>沒有任何預兆,迷宮在關閉日之前封閉了,回城的傳送失敗。地板一片片變成隨機的傳送門。</p><p class="mute" style="margin-top:6px">撐過所有波次才能回去。聽說運氣好的話,能在這裡得到別處拿不到的東西。</p>');return;}
  save();render();
};
function onEnter(r){
  const party=partyMembers(),run=S.run;
  if(r.type==='trap'){
    const spotter=party.find(m=>RACE[m.race].trap&&Math.random()<.6);
    if(spotter)r.note=`${spotter.name} 發現了地上的機關,大家繞了過去。`;
    else{const v=pick(party),d=Math.round(stats(v).maxhp*.2);v.hp=Math.max(1,v.hp-d);addStress(v,8);r.note=`${FIELDS[r.field]?.traps>=3?'哥布林設下的':''}陷阱啟動了,${v.name} 受到 ${d} 點傷害。`;}
    toast(r.note);r.cleared=true;
  }
  if(r.type==='empty'){party.forEach(m=>addStress(m,2));r.cleared=true;}
  if((r.type==='combat')&&FIELDS[r.field]?.fx==='witch'&&run.witchH>=48&&!r.enemies.includes('carnivaro')&&Math.random()<.5){r.enemies=['carnivaro',...r.enemies].slice(0,4);toast('魔女之眼注視著你們……卡納巴洛出現了!');}
}
ACT.fight=()=>{const r=S.run.map.rooms[S.run.map.cur];if(roomHasFoes(r))startBattle(r.enemies,{rift:r.type==='rift',riftKey:r.rift});};
ACT.sneak=()=>{const r=S.run.map.rooms[S.run.map.cur];if(!roomHasFoes(r))return;r.cleared=true;r.sneaked=true;toast('你們屏住呼吸,從牠們身邊走了過去');save();render();};
ACT.offer=()=>{const run=S.run,r=run.map.rooms[run.map.cur],rf=RIFTS[r.rift];if(run.loot.stone<rf.cost)return;
  run.loot.stone-=rf.cost;r.type='rift';r.enemies=[rf.boss,...rf.minions];toast('魔石化成光,空間裂開了!');save();render();};
ACT.fmaster=f=>{f=+f;const fm=FLOORMASTER[f];if(!fm)return;startBattle([fm.key,...fm.minions],{fmaster:f});};
function randomNum(){const ids=Object.keys(NUM);const w=ids.map(id=>NUM[id].r==='三'?1:NUM[id].r==='雙'?4:8);let s=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<ids.length;i++){s-=w[i];if(s<=0)return{type:'num',id:ids[i],ided:false};}return{type:'num',id:ids[0],ided:false};}
ACT.openChest=()=>{
  const run=S.run,r=run.map.rooms[run.map.cur];if(r.cleared)return;
  if(r.mimic){r.type='combat';r.mimic=false;toast('寶箱是陷阱,怪物衝了出來!');save();startBattle(r.enemies,{});return;}
  const f=run.floor,st=ri(10,25)*f+f*8;run.loot.stone+=st;let msg=`魔石 +${st}`;
  if(Math.random()<.06){run.loot.items.push(randomNum());msg+=',還有一件未鑑定的編號物品!';}
  else if(Math.random()<.04){const pool=FIELDS[r.field].pool.filter(k=>ESS[k]);if(pool.length){const it=makeEss(pick(pool));run.loot.ess.push(it);msg+=`,還有一顆${essInfo(it).n}!`;}}
  if(Math.random()<.25&&S.potions<MAXPOT){S.potions++;msg+=',以及一瓶藥水';}
  r.cleared=true;toast(msg);save();render();
};
ACT.gather=()=>{
  const run=S.run,r=run.map.rooms[run.map.cur];if(r.cleared)return;const f=run.floor;const v=ri(20,35)*f;run.loot.stone+=v;
  partyMembers().forEach(m=>addStress(m,5));r.cleared=true;
  if(advanceTime(4))return;
  if(FIELDS[r.field].pool.length&&Math.random()<.25){toast(`魔石 +${v}。採集的聲音引來了怪物!`);r.type='combat';r.cleared=false;r.enemies=genEnemies(r.field,'combat');save();startBattle(r.enemies,{});return;}
  toast(`魔石 +${v}`);save();render();
};
ACT.drink=()=>{const r=S.run.map.rooms[S.run.map.cur];if(r.cleared)return;partyMembers().forEach(m=>{const st=stats(m);m.hp=Math.min(st.maxhp,m.hp+st.maxhp*.4);m.soul=Math.min(st.soul,m.soul+st.soul*.4);addStress(m,-12);});r.cleared=true;toast('全隊恢復了精神');save();render();};
ACT.buy=k=>{const run=S.run,price={potion:45,torch:80,calm:40,soul:60}[k];if(run.loot.stone<price)return;
  if(k==='potion'){if(S.potions>=MAXPOT)return;S.potions++;}if(k==='torch')S.torches++;
  if(k==='calm')partyMembers().forEach(m=>addStress(m,-20));if(k==='soul')partyMembers().forEach(m=>m.soul=stats(m).soul);
  run.loot.stone-=price;autoTorch();save();render();};
ACT.usePotion=()=>{if(!S.potions)return;const p=partyMembers();if(!p.length)return;const m=p.reduce((a,b)=>a.hp/stats(a).maxhp<b.hp/stats(b).maxhp?a:b);const st=stats(m);m.hp=Math.min(st.maxhp,m.hp+st.maxhp*.4);S.potions--;toast(`${m.name} 喝下藥水`);save();render();};
ACT.lightTorch=()=>{if(!S.torches||S.run.torchH>0)return;S.torches--;S.run.torchH=72;save();render();};
function restParty(pct,stress){partyMembers().forEach(m=>{const st=stats(m);m.hp=Math.min(st.maxhp,m.hp+st.maxhp*pct);addStress(m,-stress);});}
ACT.camp=()=>{
  const run=S.run;restParty(.25,6);
  if(advanceTime(8))return;
  const fieldK=curField(run),pool=FIELDS[fieldK]?.pool||[];
  if(Math.random()<(run.curse?.35:.2)&&(pool.length||run.floor>=2)){const bandit=run.floor>=2&&(Math.random()<.4||!pool.length);
    toast(bandit?'夜裡,其他探險者摸了過來!':'睡到一半,怪物找上門了!');save();startBattle(bandit?genEnemies(fieldK,'bandit'):genEnemies(fieldK,'combat'),{ambush:1});return;}
  toast('大家輪流守夜,稍微休息了一下');save();render();
};
ACT.campSafe=()=>{restParty(.35,10);if(advanceTime(8))return;toast('在安全區好好睡了一覺');save();render();};
ACT.waitClose=()=>{const run=S.run;const h=stayLimit(run)-run.h;restParty(1,30);advanceTime(Math.max(1,h));};
ACT.descend=to=>{
  const run=S.run;if(run.collapse)return;const nf=run.floor+1;if(nf>6)return;if(nf===6&&!(S.ship>=1&&S.navigator))return;
  setupFloor(nf,nf===2?(to||pick(['beast','dead','desert','gforest'])):null);
  const msgs=portalXp(partyMembers(),nf);
  log(`隊伍來到第 ${nf} 層「${run.tower?'天空之塔':FIELDS[curField(run)].n}」。`);save();render();
  modal(`第 ${nf} 層 · ${run.tower?'天空之塔':FIELDS[curField(run)].n}`,`<p class="mute">這一層會在第 ${FLOORS[nf].stay} 天關閉,還剩 ${fmtH(stayLimit(run)-run.h)}。</p>${nf===4?'<p style="margin-top:6px">一踏進塔裡,第 3 層的怪物就成群撲了過來!</p>':''}${msgs.join('')}`);
  if(nf===4){run.tower.pending=0;startBattle(towerEnemies(3),{tower:1});}

function returnToCity(title,lead,bonus){
  const run=S.run,L=run.loot;
  if(bonus){L.stone=Math.round(L.stone*1.5);L.ess.push(makeEss(pick(Object.keys(ESS).filter(k=>ESS[k].g===8&&!ESS[k].guard))));}
  S.stone+=L.stone;S.bag.push(...L.ess);S.items.push(...L.items);
  const days=Math.floor(run.h/24)+1,names=partyMembers().map(m=>m.name).join('、');
  S.run=null;S.screen='base';processDays(days,new Set(run.party));
  log(`${names||'隊伍'} 回到拉夫多尼亞,帶回 ${L.stone} 石幣的魔石${L.ess.length?`、精髓 ${L.ess.length} 顆`:''}${L.items.length?`、物品 ${L.items.length} 件`:''}。`);
  save();render();
  modal(title,`<p class="mute">${lead} 這趟一共 ${days} 天。</p><div class="loot" style="margin-top:8px"><span>石幣<b>${L.stone}</b></span><span>物品<b>${L.items.length}</b></span></div>${L.ess.length?`<p style="margin-top:8px">精髓:${L.ess.map(it=>essInfo(it).n).join('、')}(已放進交易所的背包)</p>`:''}`);
}

  const u={side:'e',key:k,uid:eid++,name:d.n,g:d.g,hp:d.hp,maxhp:d.hp,atk:d.atk,def:d.def,spd:d.spd,mres:d.mres??(10-d.g)*3,weak:d.weak||[],resist:d.resist||[],tough:d.tough,toughMax:d.tough,broken:false,
    boss:!!d.boss,elite:!!d.elite,atkdt:d.atkdt||null,tags:t,summoned:false,buffs:[],intent:t.passive?'watch':'atk',pat:0,provoked:!t.passive,img:monImg(k,d.boss?Math.min((d.spr.sc||5),5):d.elite?Math.min(d.spr.sc||4,4):Math.min(d.spr.sc||3,4)),icon:monImg(k,2)};

function labelDupes(){const cnt={};B.units.filter(u=>u.side==='e').forEach(u=>{cnt[u.key]=(cnt[u.key]||0)+1;});const seen={};

const aliveU=u=>u&&!u.dead&&!u.down;
const buffSum=(u,k)=>u.buffs.reduce((a,b)=>a+(typeof b[k]==='number'?b[k]:0),0);

function startBattle(enemies,opt={}){
  const run=S.run;
  const pm=opt.exam?S.sel.map(getM).filter(m=>m&&!m.dead):partyMembers().filter(m=>m.hp>0);
  const units=pm.map(heroUnit).concat(enemies.map(monUnit));
  const fx=run&&!opt.exam?FIELDS[curField(run)]?.fx:null;
  units.forEach(u=>{if(u.side==='p'&&fx==='frost'&&!u.num.warm)u.buffs.push({label:'嚴寒',spd:-.15,t:99});if(u.side==='p'&&fx==='specter')u.buffs.push({label:'地縛靈',vuln:.25,t:99});});
  if(run&&!opt.ambush&&!opt.exam&&!run.curse&&enemies.some(k=>(MON[k].tags||{}).curse)){run.curse=true;toast('你們先對女妖出手,被下了「怨恨之印」。詛咒會跟著你們直到離開迷宮。');}
  units.forEach(u=>u.av=10000/effSpd(u)*(u.side==='e'&&opt.ambush?.6:1));
  B={units,over:false,win:false,target:null,token:{},opt,f:run?run.floor:0,loot:{stone:0,ess:[],items:[]},kills:new Set(),waiting:null,actor:null,turn:0,fx};
  labelDupes();
  S.screen='battle';$('#top').innerHTML=topHTML();
  const bg=run&&!opt.exam?FLOORS[run.floor].bg:'linear-gradient(#2a2620,#14110d)';
  const title=opt.exam?'公會晉級考試':opt.rift?`裂縫・${RIFTS[opt.riftKey]?.n||''}`:opt.fmaster?`層主・${FLOORMASTER[opt.fmaster].n}`:opt.collapse?`次元崩壞・第 ${run.collapse.wave+1} 波`:`戰鬥 · 第 ${run.floor} 層`;
  $('#screen').innerHTML=`<section class="bt" id="bt"><div class="bt-top"><h2>${title}</h2><div class="row">
    <button class="btn sm" id="bAuto" data-act="bAuto">自動:${S.auto?'開':'關'}</button><button class="btn sm" id="bFast" data-act="bFast">速度:${S.fast?'快':'普通'}</button></div></div>
    <div class="order" id="bOrder"></div><div class="stage" id="bStage" style="--stagebg:${bg}"></div><div class="team" id="bTeam"></div><div class="cmd" id="bCmd"></div><div class="fxl" id="bFx" aria-hidden="true"></div><div class="sr" id="bLive" aria-live="polite"></div></section>`;
  renderBattle();battleLoop(B.token,opt);
}

function unitEl(u){const i=B.units.indexOf(u);return u.side==='e'?document.querySelector(`#bStage [data-arg="${i}"]`):document.querySelector(`#bTeam [data-u="${i}"]`);}
function pop(u,text,cls=''){const fx=$('#bFx'),bt=$('#bt');if(!fx||!bt||!B)return;const el=unitEl(u);if(!el)return;
  const R=bt.getBoundingClientRect(),q=el.getBoundingClientRect(),off=(u._pops=(u._pops||0)+1)%3;
  const n=document.createElement('span');n.className='pop '+cls;n.textContent=text;
  n.style.left=(q.left-R.left+q.width/2)+'px';n.style.top=(q.top-R.top+q.height*(u.side==='e'?.32:.22)-off*16)+'px';
  fx.appendChild(n);setTimeout(()=>n.remove(),1000);}
function live(t){const l=$('#bLive');if(l)l.textContent=t;}
async function say(t,cls='',u=null){if(!B)return;renderStage();renderTeam();if(u)pop(u,t,cls);live((u?u.name+' ':'')+t);await delay();}
async function banner(t,cls=''){if(!B)return;const fx=$('#bFx');if(fx){const n=document.createElement('div');n.className='banner '+cls;n.textContent=t;fx.appendChild(n);setTimeout(()=>n.remove(),1200);}live(t);await delay(S.fast?450:900);}
const effSpd=u=>u.spd*Math.max(.3,1+buffSum(u,'spd')+(u.momentum||0)*.05);
function upcoming(n){const live=B.units.filter(aliveU).map(u=>({u,av:u.av}));const out=[];if(!live.length)return out;
  for(let i=0;i<n;i++){let a=live[0];for(const x of live)if(x.av<a.av)a=x;const t=a.av;live.forEach(x=>x.av-=t);out.push(a.u);a.av=10000/effSpd(a.u);}return out;}

function nextActor(){const live=B.units.filter(aliveU);let a=live[0];for(const u of live)if(u.av<a.av)a=u;const t=a.av;live.forEach(u=>u.av-=t);return a;}

function checkEnd(){const pa=B.units.some(u=>u.side==='p'&&aliveU(u)),ea=B.units.some(u=>u.side==='e'&&aliveU(u));if(!pa||!ea){B.over=true;B.win=!ea&&pa;}}

async function dots(a){for(const b of a.buffs.filter(x=>x.dot)){const d=Math.max(1,Math.round(b.dot));a.hp-=d;await say(`${b.label} ${d}`,'st',a);if(a.hp<=0){await fall(a,null);return true;}}return false;}
async function takeTurn(a,tok){

function autoChoose(a){
  const foes=targetable('e',a),allies=B.units.filter(u=>u.side==='p'&&aliveU(u));

  for(const k of a.skills){const s=SK[k];if(!can(k))continue;

    if(s.kind==='aoe'&&foes.length>=2)return{type:'sk',k};
    if(k==='roar'&&B.units.some(f=>f.side==='e'&&aliveU(f)&&f.intent==='smash'))return{type:'sk',k};
    if(s.kind==='team'&&!a.buffs.some(b=>b.label===s.label)&&Math.random()<.5)return{type:'sk',k};
  }
  const t=foes.find(f=>isKnown(f.key)&&f.weak.includes(a.dt)&&!f.broken)||foes.reduce((x,y)=>y.hp<x.hp?y:x,foes[0]);

}
function partyTarget(){

}
function decideIntent(a){
  const t=a.tags;if(a.intent==='charge')return'smash';
  if(a.boss){const pat=['atk',t.aoe?'aoe':'atk',t.bind?'bind':t.fear?'fear':t.silence?'silence':'atk',t.heavy?'charge':'atk'];const it=pat[a.pat%pat.length];a.pat++;return it;}
  const r=Math.random();
  if(t.heal&&B&&B.units.some(u=>u.side==='e'&&aliveU(u)&&u.hp/u.maxhp<.6)&&r<.5)return'heal';
  if(t.buff&&r<.2)return'buff';
  if(t.bind&&r<.22)return'bind';
  if(t.fear&&r<.2)return'fear';
  if(t.heavy&&r<.25)return'charge';
  if(t.aoe&&r<.3)return'aoe';

}
function enemyAct(a){if(a.tags.summon&&!a.summoned&&a.hp<a.maxhp*.5&&B.units.filter(u=>u.side==='e'&&aliveU(u)).length<5)return{type:'summon'};

function effAtk(u){let a=u.atk*(1+buffSum(u,'atk'));if(hasBuff(u,'madness'))a+=u.def*2;if(u.side==='p'){const s=u.m.stress;if(s>=100)a*=.7;else if(s>=70)a*=.9;if(u.num.rage&&u.hp<u.maxhp*.3)a*=1+u.num.rage;}return a;}
function effDef(u,magic){if(!magic&&hasBuff(u,'madness'))return 0;let base=magic?u.mres:u.def;let k=1+buffSum(u,magic?'mres':'def')*(magic?0:1);let v=base*k+(magic?buffSum(u,'mres'):0);

async function hit(src,t,mult,dt,brk,opt){

  if(t.side==='e'&&tag==='weak'&&!t.broken&&brk&&t.hp>0){t.tough-=brk*((src.w&&src.w.brk)||1);
    if(t.tough<=0){t.tough=0;t.broken=true;t.av+=5000/t.spd;const ex=Math.round(src.atk*.5);t.hp-=ex;await say('體勢崩潰 '+ex,'gold',t);renderOrder();}}

    if(src.side==='p'&&src.pas.includes('paralyzeHit')&&Math.random()<.2){t.av+=3000/t.spd;pop(t,'麻痺','st');}

async function fall(t,src){

async function endBattle(tok){
  const run=S.run,opt=B.opt,pu=B.units.filter(u=>u.side==='p');
  if(B.fled){
    const lost=[];for(const u of pu){const m=u.m;m.soul=u.soul;if(u.down){if(Math.random()<.15&&!m.hero){lost.push(m.name);killMember(m);continue;}m.hp=Math.max(1,Math.round(u.maxhp*.1));}else m.hp=Math.max(1,Math.round(u.hp));addStress(m,12);}
    B.units.filter(u=>u.side==='e').forEach(u=>learn(u.key));
    run.party=run.party.filter(id=>{const m=getM(id);return m&&!m.dead;});B=null;
    if(run.map&&!opt.ambush&&!opt.tower)run.map.cur=run.prev;S.screen='dungeon';
    if(!run.party.length){wipeOut([]);return;}
    save();render();toast(lost.length?`逃跑時 ${lost.join('、')} 沒能跟上……`:'你們狼狽地逃了出來');return;
  }
  await banner(B.win?(opt.exam?'考試合格':'勝利'):(opt.exam?'考試落榜':'全隊倒下'),B.win?'':'bad');
  if(!B||B.token!==tok)return;
  B.units.filter(u=>u.side==='e').forEach(u=>learn(u.key));
  if(opt.exam){const win=B.win;pu.forEach(u=>{u.m.hp=Math.max(1,Math.round(u.down?u.maxhp*.2:u.hp));u.m.soul=u.soul;});B=null;S.screen='base';
    if(win){S.examPassed=true;S.fame+=10;log('通過了 5 級晉級考試!公會的認證上限提高到 4 級。');refreshShop();}else log('晉級考試沒有通過。下次再來。');
    save();render();modal(win?'考試合格':'考試落榜',win?'<p>考官收起劍,點了點頭。你們的實力得到了公會的承認。</p>':'<p class="mute">考官手下留情,沒有人受重傷。</p>');return;}
  const win=B.win,loot=B.loot,kills=[...B.kills],deaths=[],downed=[],xpLines=[];
  if(win){
    for(const u of pu){const m=u.m;m.soul=u.soul;
      if(u.down){if(Math.random()<.3){deaths.push(m.name);killMember(m);continue;}m.hp=Math.max(1,Math.round(u.maxhp*.1));addStress(m,20);downed.push(m.name);}
      else m.hp=Math.max(1,Math.round(u.hp));
      addStress(m,3+run.floor);
      let xp=0;const fresh=[];for(const k of kills){if(!m.kills.includes(k)){m.kills.push(k);xp+=GRADE[MON[k].g].xp;fresh.push(MON[k].n);}}
      if(opt.rift)xp+=3;
      if(opt.fmaster)xp+=5;
      if(xp){const ups=gainXp(m,xp);xpLines.push(`${m.name}:${fresh.length?`第一次打倒${fresh.join('、')}`:''}${opt.rift?(fresh.length?',':'')+'打倒守護者 +3':''}${opt.fmaster?(fresh.length?',':'')+'打倒層主 +5':''},經驗 +${xp}${ups.length?`,<span style="color:var(--torch-hi)">升到 Lv${m.lv}!</span>`:''}`);}
    }
    run.party=run.party.filter(id=>{const m=getM(id);return m&&!m.dead;});
    run.loot.stone+=loot.stone;run.loot.ess.push(...loot.ess);run.loot.items.push(...loot.items);
    if(run.map&&!opt.tower&&!opt.collapse){const room=run.map.rooms[run.map.cur];if(room&&roomHasFoes(room))room.cleared=true;}
    if(opt.rift){S.riftCD[opt.riftKey]=S.month+2;S.riftsCleared++;S.fame+=5;log(`打倒了裂縫「${RIFTS[opt.riftKey].n}」的守護者。`);}
    if(opt.tower&&run.tower){if(opt.boss)run.tower.guardDone=true;else{run.tower.stage=Math.min(100,run.tower.stage+(run.tower.pending||0));run.tower.choices=towerChoices();}}
    if(opt.collapse&&run.collapse){run.collapse.wave++;}
    if(opt.fmaster){S.floorBoss=S.floorBoss||{};if(!S.floorBoss[opt.fmaster]){S.floorBoss[opt.fmaster]=true;S.fame+=8;}log(`打倒了第 ${opt.fmaster} 層的層主「${FLOORMASTER[opt.fmaster].n}」!`);
      if(opt.fmaster===1){S.dreadKills=(S.dreadKills||0)+1;if(S.dreadKills>=9)log('接連打倒了九次「恐懼之主」,深處傳來了更深沉的氣息……');}
      if(opt.fmaster==='abyss')S.dreadKills=0;
      if(opt.fmaster===4&&pu.length===1){S.stone+=800;log(`${pu[0].m.name} 獨自打倒了天空之主,守衛認可了這份孤高的實力,額外獲得 800 石幣。`);}}
  }else if(opt.fmaster===1){
    const victim=pick(pu).m;deaths.push(victim.name);killMember(victim);
    pu.filter(u=>u.m!==victim).forEach(u=>{u.m.soul=u.soul;u.m.hp=Math.max(1,Math.round(u.maxhp*.2));addStress(u.m,15);});
    run.party=run.party.filter(id=>{const m=getM(id);return m&&!m.dead;});
    log(`恐懼之主消失前,拖走了觸發這場戰鬥的${victim.name},其他人僥倖逃了回來。`);
  }else{for(const u of pu){deaths.push(u.m.name);killMember(u.m);}run.party=[];}
  B=null;
  if(!run.party.length){wipeOut(deaths);return;}
  S.screen='dungeon';
  if(opt.collapse&&run.collapse&&run.collapse.wave>=run.collapse.total){save();returnToCity('撐過了次元崩壞','最後一波結束,扭曲的空間把你們吐回了次元廣場。混亂中撿到的東西都還在身上。',true);return;}
  if(advanceTime(2))return;
  save();render();
  const parts=[`<p>魔石 +${loot.stone}</p>`];
  if(loot.ess.length)parts.push(`<p style="color:var(--torch-hi)">取得:${loot.ess.map(it=>essInfo(it).n).join('、')}</p>`);
  if(loot.items.length)parts.push(`<p style="color:var(--torch-hi)">取得:${loot.items.map(it=>it.type==='riftstone'?'裂縫石':'未鑑定的編號物品').join('、')}</p>`);
  parts.push(xpLines.length?`<div style="margin-top:6px">${xpLines.map(l=>`<p>${l}</p>`).join('')}</div>`:'<p class="mute">都是打過的怪物,沒有獲得經驗。</p>');
  if(downed.length)parts.push(`<p class="mute">${downed.join('、')} 重傷撿回一命,壓力大增。</p>`);
  if(deaths.length)parts.push(`<p style="color:var(--blood)">${deaths.join('、')} 傷得太重,沒能撐下去。</p>`);
  if(opt.tower&&!opt.boss&&run.tower)parts.push(`<p class="mute">天空之塔:第 ${run.tower.stage} 階</p>`);
  modal(!win?'恐懼之主消失了':opt.rift?'守護者倒下了':opt.fmaster?'層主倒下了':'勝利',parts.join(''));
}
function wipeOut(deaths){
  const run=S.run,keep=runHas('keepLoot')||false;
  const kept=keep?{stone:Math.round(run.loot.stone/2),ess:run.loot.ess.slice(0,Math.ceil(run.loot.ess.length/2)),items:run.loot.items.slice(0,Math.ceil(run.loot.items.length/2))}:null;
  if(kept){S.stone+=kept.stone;S.bag.push(...kept.ess);S.items.push(...kept.items);}
  const days=Math.max(1,Math.floor(stayLimit(run)/24))+1;S.run=null;S.screen='base';processDays(days);
  log(`隊伍在第 ${run.floor} 層全滅${kept?',擴充型背包保住了一部分戰利品':',身上的戰利品全部遺失'}。`);save();render();
  const h=hero();
  modal('全隊覆滅',`<p>${deaths.filter(n=>!h||n!==h.name).join('、')||'同伴們'}再也沒有回來。</p>${h&&h.dead?`<p class="mute" style="margin-top:6px">${h.name} 的遺體在迷宮關閉時被送回城,安置在大神殿。</p>`:''}<p class="mute" style="margin-top:6px">${kept?'擴充型背包保住了一半的戰利品。':'身上的戰利品全部遺失。'}</p>`,[{label:'回到住處',act:'afterWipe',cls:'primary'}]);
}
ACT.afterWipe=()=>{ACT.closeModal();checkGameOver();};
document.addEventListener('keydown',e=>{if(!B||!B.waiting||!$('#modal').hidden)return;const n=parseInt(e.key,10);const btns=[...document.querySelectorAll('#bCmd .cmdb')];if(n>=1&&n<=btns.length){const b=btns[n-1];if(!b.disabled){e.preventDefault();b.click();}}});

/* ================= BOOT ================= */
SAVED=loadSave();S=newState();render();
</script>
</body>
</html>
